# garnet-runtime-review: installed by a coding agent (devin-plugin)
name: CI
run-name: ${{ github.event.action == 'edited' && github.event.changes.base.ref.from == null && 'CI (metadata edit)' || 'CI (capture)' }}
on:
  push:
    branches: [main, exhibit/playwright]
  pull_request:
    branches: [main, exhibit/playwright]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  runtime-build:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != null))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: garnet-org/action@24833a47c19aad605bb10bcd9b8cad8f318ca187 # v2.6.0
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sentry CLI install + smoke
        run: node node_modules/@sentry/cli/scripts/install.js && npx sentry-cli --version
      - name: Build
        run: npm run build
      - name: Let sensor settle
        if: always()
        run: sleep 30

  adapter-tests:
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node --test
