name: Garnet Runtime Review check
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    branches: [main, exhibit/playwright]
    types: [edited]

permissions: {}

jobs:
  invalidate-retarget:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.changes.base.ref.from != null &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Invalidate checks from the previous PR base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/runtime-review.mjs invalidate-retarget

  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.display_title != 'CI (metadata edit)'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # workflow_run's github.sha is on the default branch, not the PR.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Publish head-bound exhibit check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/runtime-review.mjs publish
